[build-system]
requires = ["setuptools>=80,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-ticket-intelligence"
version = "0.1.0"
description = "An evaluated banking-support classification and human-review platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.32,<1.0",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.6,<2",
    "sqlalchemy>=2.0,<3",
    "PyMySQL>=1.2.3,<2",
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
transformer = ["torch>=2.5,<3", "transformers>=4.46,<6", "safetensors>=0.4,<1"]
postgres-migration = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
ticket-api = "ticket_intelligence.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
